# Suite A runs on every push and must be 100% green (spec section 11.1).
# Suite B (LLM evaluation) is a floating metric, costs money per run, and is
# deliberately kept off the build gate — it runs nightly instead.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly slot for Suite B, once it has an API key configured.
    - cron: "0 18 * * *"

jobs:
  suite-a:
    name: Suite A - deterministic governance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Suite A
        # Real PostgreSQL is started in-process by zonky embedded-postgres,
        # so no service container is needed.
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-a-results
          path: target/surefire-reports/

  build-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: suite-a
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bizmcp:ci .

  suite-b:
    name: Suite B - LLM evaluation (nightly, non-blocking)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: mvn -B test -Dgroups=llm-eval -DfailIfNoTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: docs/eval-report.md
