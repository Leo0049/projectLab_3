<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>BizMCP 審批中心</title>
    <style>
        body { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
               margin: 2rem auto; max-width: 66rem; color: #1c1c1e; }
        h1 { font-size: 1.4rem; }
        .who { color: #666; font-size: .9rem; margin-bottom: 1.5rem; }
        table { border-collapse: collapse; width: 100%; font-size: .9rem; }
        th, td { border: 1px solid #ddd; padding: .55rem .7rem; text-align: left; vertical-align: top; }
        th { background: #f5f5f7; }
        .status { font-weight: 600; }
        .PENDING { color: #b26a00; }
        .EXECUTED { color: #1a7f37; }
        .EXECUTION_FAILED, .ABANDONED { color: #c1121f; }
        .REJECTED, .EXPIRED { color: #666; }
        .id { font-family: ui-monospace, monospace; }
        .timing { color: #666; font-size: .8rem; }
        .timing.urgent { color: #b26a00; font-weight: 600; }
        .headline { font-size: 1.05rem; font-weight: 600; line-height: 1.5; }
        .change { white-space: nowrap; }
        .delta { font-family: ui-monospace, monospace; font-size: .8rem; font-weight: 400;
                 border-radius: 4px; padding: .05rem .35rem; white-space: nowrap;
                 background: #eef3ee; color: #1a7f37; }
        .delta.down { background: #fdecea; color: #c1121f; }
        .note { font-size: .8rem; margin-top: .35rem; }
        .note.warn { color: #c1121f; }
        .note.info { color: #666; }
        .fields { margin: 0; font-size: .85rem; }
        .fields dt { color: #888; font-size: .75rem; margin-top: .2rem; }
        .fields dt:first-of-type { margin-top: 0; }
        .fields dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
        details { margin-top: .5rem; }
        summary { font-size: .75rem; color: #666; cursor: pointer; }
        pre { font-family: ui-monospace, monospace; font-size: .75rem; background: #fafafa;
              border: 1px solid #eee; padding: .4rem; margin: .3rem 0 0;
              white-space: pre-wrap; word-break: break-all; }
        .msg { padding: .6rem .8rem; border-radius: 6px; margin-bottom: 1rem; }
        .ok { background: #e7f6ec; color: #1a7f37; }
        .err { background: #fdecea; color: #c1121f; }
        button { padding: .3rem .7rem; cursor: pointer; }
        .empty { color: #666; padding: 2rem 0; }
    </style>
</head>
<body>
<h1>BizMCP 審批中心</h1>
<p class="who">
    審批者：<span th:text="${displayName}">—</span>
    ｜ <a href="/logout">登出</a>
</p>

<div th:if="${message}" class="msg ok" th:text="${message}"></div>
<div th:if="${error}" class="msg err" th:text="${error}"></div>

<p class="empty" th:if="${#lists.isEmpty(requests)}">目前沒有任何審批單。</p>

<table th:unless="${#lists.isEmpty(requests)}">
    <colgroup>
        <col style="width: 13%"><col style="width: 13%"><col style="width: 14%">
        <col style="width: 27%"><col style="width: 20%"><col style="width: 13%">
    </colgroup>
    <thead>
    <tr>
        <th>審批單</th>
        <th>工具</th>
        <th>參數</th>
        <th>影響預覽</th>
        <th>狀態</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${requests}">
        <td>
            <span class="id" th:text="${r.id}">apr_x</span><br>
            <small class="timing" th:classappend="${r.urgent} ? 'urgent'"
                   th:text="${r.timing}">timing</small>
        </td>
        <td th:text="${r.toolName}">tool</td>
        <td>
            <dl class="fields">
                <th:block th:each="f : ${r.arguments}">
                    <dt th:text="${f.label}">key</dt>
                    <dd th:text="${f.value}">value</dd>
                </th:block>
            </dl>
            <details>
                <summary>原始參數</summary>
                <pre th:text="${r.rawArguments}">{}</pre>
            </details>
        </td>
        <td>
            <!-- The point of the page: a decision, not a JSON blob. The raw
                 preview stays one click away, because the approver is deciding
                 on unmasked values and must be able to see exactly what was
                 requested. -->
            <div class="headline" th:if="${r.subject}">
                <span th:text="${r.subject}">珍珠奶茶</span>
                <span class="change" th:text="${r.change}">120 → 100</span>
                <span class="delta" th:if="${r.deltaLabel}" th:classappend="${r.decrease} ? 'down'"
                      th:text="${r.deltaLabel}">-20</span>
            </div>
            <dl class="fields" th:unless="${#lists.isEmpty(r.previewFields)}">
                <th:block th:each="f : ${r.previewFields}">
                    <dt th:text="${f.label}">key</dt>
                    <dd th:text="${f.value}">value</dd>
                </th:block>
            </dl>
            <div th:each="n : ${r.notes}" class="note" th:classappend="${n.level}"
                 th:text="${n.text}">note</div>
            <details>
                <summary>原始預覽</summary>
                <pre th:text="${r.rawPreview}">{}</pre>
            </details>
        </td>
        <td>
            <span class="status" th:classappend="${r.status}" th:text="${r.status}">PENDING</span>
            <div th:if="${r.failureReason}" style="color:#c1121f" th:text="${r.failureReason}"></div>
            <div th:if="${r.rejectReason}" style="color:#666" th:text="${r.rejectReason}"></div>
            <small th:if="${r.retryCount > 0}" th:text="'已重試 ' + ${r.retryCount} + ' 次'"></small>
        </td>
        <td>
            <form th:if="${r.status.name() == 'PENDING'}"
                  th:action="@{'/approvals/' + ${r.id} + '/approve'}" method="post"
                  style="display:inline">
                <button type="submit">核准</button>
            </form>
            <form th:if="${r.status.name() == 'PENDING'}"
                  th:action="@{'/approvals/' + ${r.id} + '/reject'}" method="post"
                  style="display:inline">
                <input type="text" name="reason" placeholder="駁回原因" size="12">
                <button type="submit">駁回</button>
            </form>
            <form th:if="${r.status.name() == 'EXECUTION_FAILED'}"
                  th:action="@{'/approvals/' + ${r.id} + '/retry'}" method="post"
                  style="display:inline">
                <button type="submit">重試</button>
            </form>
            <span th:if="${r.status.terminal}">—</span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
