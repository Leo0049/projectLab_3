spring:
  # Suite A runs against a real PostgreSQL started in-process by zonky
  # embedded-postgres, so JSONB and the query templates are exercised for real
  # without requiring a Docker daemon. See AbstractPostgresTest.
  flyway:
    locations: classpath:db/migration,classpath:db/seed/test

  jpa:
    hibernate:
      ddl-auto: validate

  autoconfigure:
    # Boot 4 names these DataRedis*, not Redis*. The earlier (wrong) names were
    # silently ignored, so Redis autoconfiguration was in fact active in tests
    # and /actuator/health reported DOWN.
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

bizmcp:
  governance:
    # Tests have no Redis server; per-instance counters are what we want here,
    # and stating it explicitly means the quota tests cannot silently start
    # exercising a different implementation.
    rate-limit-backend: MEMORY
    max-rows: 200
    approval-ttl: PT30M
    max-approval-retries: 3
    rate-limits:
      T1: { perMinute: 60, perDay: 2000 }
      T2: { perMinute: 20, perDay: 300 }
      T3: { perMinute: 5, perDay: 20 }

logging:
  level:
    com.bizmcp: INFO
    org.springframework.jdbc.core: INFO
