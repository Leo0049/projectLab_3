# Fixture for StartupValidationTest: a template with no tenant predicate.
# The application must refuse to start rather than serve this.
templates:
  - id: sales.unscoped
    riskTier: T1
    maxRows: 200
    sql: |
      SELECT s.store_id AS group_id, SUM(o.total_amount) AS revenue
      FROM orders o
      JOIN stores s ON s.store_id = o.store_id
      GROUP BY s.store_id
